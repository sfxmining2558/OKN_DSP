name: OKN_DSP Build APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract Build Package
      run: |
        unzip OKN_DSP_BUILD.zip
        chmod +x build_apk.sh
        ./build_apk.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OKN_DSP_APK
        path: "**/*.apk"
